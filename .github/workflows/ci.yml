name: CI/CD Pipeline - MĀRG-DRISHTI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  lint-and-build-client:
    name: Build & Validate Client (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Production Frontend
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-production-build
          path: client/dist
          retention-days: 7

  validate-server:
    name: Validate Backend Server (Node.js & Express)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Validate Server Syntax & Integrity
        run: |
          node -c server.js
          node -c routes/potholes.js
          node -c services/authorityMapper.js
          node -c services/notificationService.js
          node -c services/aiDetectionService.js
          echo "All server services and routes passed syntax checks!"

  validate-ai-service:
    name: Validate Python AI & YOLOv8 Microservice
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./ai_service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install AI Service Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python App Compilation
        run: |
          python -m py_compile app.py
          echo "FastAPI application compiled without syntax errors!"
